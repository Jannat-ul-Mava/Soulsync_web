<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SoulSync — Mental Health Screening</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../Css/test.css">
</head>
<body>

<!-- ══ HEADER ══ -->
<header class="site-header">
  <div class="header-inner">
    <div class="header-text">
      <h1 class="header-title">Mental Health Screening Test</h1>
      <p class="header-sub">Your responses are confidential and help us provide better care</p>
    </div>
    <div class="header-meta">
      <div class="q-label">Question <span id="qCurrent">1</span> of <span id="qTotal">20</span></div>
      <div class="pct-label" id="pctLabel">5%</div>
    </div>
  </div>
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progressFill"></div>
  </div>
</header>

<!-- ══ MAIN ══ -->
<main class="main-content">
  <div class="question-wrap" id="questionWrap">

    <!-- Question bubble -->
    <div class="question-bubble" id="questionBubble">
      <p class="question-text" id="questionText">Loading…</p>
    </div>

    <!-- Options -->
    <div class="options-list" id="optionsList"></div>

    <!-- Alert (sensitive questions) -->
    <div class="alert-box" id="alertBox" style="display:none">
      <span class="alert-icon">⚠️</span>
      <div>
        <div class="alert-title" id="alertTitle"></div>
        <div class="alert-body" id="alertBody"></div>
      </div>
    </div>

  </div>
</main>

<!-- ══ FOOTER NAV ══ -->
<footer class="site-footer">
  <button class="btn-prev" id="btnPrev" onclick="goBack()">← Previous</button>
  <button class="btn-next" id="btnNext" onclick="goNext()" disabled>Next →</button>
</footer>

<script src="/JavaScript/Test.js"></script>
</body>
</html>
